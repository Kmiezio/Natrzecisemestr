<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szczegóły premiery gry - Natrzecisemestr</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-menu-container">
            <button class="header-menu-btn" type="button">☰ MENU</button>
            <div class="header-menu">
                <a href="index.html">HOME 🏚️</a>
                <a href="premiery.html">PREMIERY 📅</a>
                <a href="kontakt.html">KONTAKT 🧑</a>
            </div>
        </div>

        <div class="header-title">
            <h3 id="page-title">Kebab i Gry</h3>
        </div>

        <div class="header-search-box">
            <form action="premiery.html" method="get" id="search-box">
                <input type="search" name="search" id="search-input" placeholder="Szukaj..." autocomplete="off">
            </form>
        </div>
    </header>

    <main>
        <div class="main-section">
            <div class="main-section-center" style="padding: 40px 20px;">
                <div id="widok-szczegolow-premiery" style="color: white; text-align: center; max-width: 700px; margin: 0 auto; width: 100%;">
                    <h2 style="color: #00ff66;">Ładowanie informacji o premierze gry...</h2>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-section">
                <h3>Natrzecisemestr</h3>
                <p>Strona z informacjami o grach.</p>
            </div>
            <div class="footer-section">
                <h4>Nawigacja</h4>
                <a href="index.html">HOME</a>
                <a href="premiery.html">PREMIERY</a>
                <a href="kontakt.html">KONTAKT</a>
            </div>
            <div class="footer-section">
                <h4>Autorzy</h4>
                <p>Mateusz Tomczuk</p>
                <p>Jakub Miezio</p>
                <p>Kuba Kirej</p>
            </div>
        </div>
        <div class="footer-bottom">&copy; 2026 Natrzecisemestr</div>
    </footer>

    <script>
        const RAWG_API_KEY = "771fdf2bdf0d42afa9fd23d435b26eab";
        const menuBtn = document.querySelector(".header-menu-btn");
        const menuDropdown = document.querySelector(".header-menu");
        const detailsContainer = document.getElementById("widok-szczegolow-premiery");
        const gameId = new URLSearchParams(window.location.search).get("id");

        if (menuBtn && menuDropdown) {
            menuBtn.addEventListener("click", () => {
                menuDropdown.classList.toggle("active");
            });
        }

        function formatReleaseDate(dateString) {
            if (!dateString) return "Brak danych";

            return new Intl.DateTimeFormat("pl-PL", {
                day: "numeric",
                month: "long",
                year: "numeric"
            }).format(new Date(`${dateString}T12:00:00`));
        }

        function joinNames(items) {
            if (!Array.isArray(items) || items.length === 0) return "Brak danych";
            return items.map(item => item.name || item.platform?.name).filter(Boolean).join(", ") || "Brak danych";
        }

        function createInfoRow(icon, label, value, greenValue = false) {
            const row = document.createElement("div");
            row.style.cssText = "display:flex; justify-content:space-between; gap:20px; border-bottom:1px solid #252525; padding-bottom:10px; align-items:flex-start;";

            const labelElement = document.createElement("span");
            labelElement.style.color = "#aaa";
            labelElement.textContent = `${icon} ${label}:`;

            const valueElement = document.createElement("strong");
            valueElement.style.color = greenValue ? "#00ff66" : "#ffffff";
            valueElement.style.textAlign = "right";
            valueElement.textContent = value;

            row.append(labelElement, valueElement);
            return row;
        }

        function renderGame(game) {
            detailsContainer.replaceChildren();

            const title = document.createElement("h1");
            title.style.cssText = "color:#00ff66; margin-bottom:5px; font-size:2.2rem; font-weight:bold;";
            title.textContent = game.name || "Nieznana gra";

            const meta = document.createElement("p");
            meta.style.cssText = "color:#888; font-size:14px; margin-bottom:25px;";
            meta.textContent = `ID gry: ${game.id} | Dane z RAWG`;

            let cover;
            if (game.background_image) {
                cover = document.createElement("img");
                cover.src = game.background_image;
                cover.alt = `Okładka gry ${game.name}`;
                cover.style.cssText = "max-width:360px; width:100%; max-height:470px; object-fit:cover; border-radius:8px; margin-bottom:25px; background:#101010; padding:10px; border:2px solid #323232; box-shadow:0 4px 15px rgba(0,255,102,0.15);";
                cover.addEventListener("error", () => {
                    const placeholder = document.createElement("div");
                    placeholder.style.cssText = "max-width:360px; min-height:220px; margin:0 auto 25px; display:grid; place-items:center; border:2px solid #323232; border-radius:8px; background:#101010; color:#888;";
                    placeholder.textContent = "Brak okładki";
                    cover.replaceWith(placeholder);
                });
            } else {
                cover = document.createElement("div");
                cover.style.cssText = "max-width:360px; min-height:220px; margin:0 auto 25px; display:grid; place-items:center; border:2px solid #323232; border-radius:8px; background:#101010; color:#888;";
                cover.textContent = "Brak okładki";
            }

            const infoPanel = document.createElement("div");
            infoPanel.style.cssText = "background:#151515; padding:25px; border-radius:8px; border:1px solid #323232; margin-bottom:30px; text-align:left; display:grid; gap:15px;";

            const platforms = joinNames(game.platforms || []);
            const genres = joinNames(game.genres || []);

            infoPanel.append(
                createInfoRow("📅", "Data premiery", formatReleaseDate(game.released)),
                createInfoRow("🎮", "Platformy", platforms, true),
                createInfoRow("🧩", "Gatunek", genres)
            );

            const backLink = document.createElement("a");
            backLink.href = "premiery.html";
            backLink.style.cssText = "color:#aaa; text-decoration:underline; font-size:14px; display:inline-block; margin-top:15px;";
            backLink.textContent = "← Wróć do kalendarza premier";

            detailsContainer.append(title, meta, cover, infoPanel, backLink);
        }

        async function loadGameDetails() {
            if (!gameId) {
                detailsContainer.innerHTML = '<p>Nie wybrano żadnej gry. Wróć do <a href="premiery.html" style="color:#00ff66;">kalendarza premier</a>.</p>';
                return;
            }

            try {
                const response = await fetch(`https://api.rawg.io/api/games/${encodeURIComponent(gameId)}?key=${RAWG_API_KEY}`);

                if (!response.ok) {
                    throw new Error(`RAWG API zwróciło kod ${response.status}`);
                }

                const game = await response.json();
                renderGame(game);
            } catch (error) {
                console.error("Nie udało się pobrać szczegółów premiery:", error);
                detailsContainer.innerHTML = '<p style="color:#ff3333; font-weight:bold;">Nie udało się załadować informacji o tej grze z API.</p><a href="premiery.html" style="color:#00ff66;">← Wróć do kalendarza premier</a>';
            }
        }

        loadGameDetails();
    </script>
</body>
</html>
