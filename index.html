<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona Główna - Natrzecisemestr</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-menu-container">
            <button class="header-menu-btn">☰ MENU</button>
            
            <div class="header-menu">
				<a href="index.html">HOME 🏚️</a>
				<a href="premiery.html">PREMIERY 📅</a>
				<a href="kontakt.html">KONTAKT 🧑</a>
            </div>
        </div>

        <div class="header-title">
            <h3 id="page-title">Kebab i Gry</h3>
        </div>

        <div class="header-search-box">
            <form action="" method="get" id="search-box">
                <input type="text" name="search" id="search-input" placeholder="Szukaj">
            </form>
        </div>
    </header>

    <main>
        <nav class="sub-nav">
            <a href=""></a>
        </nav>

        <div class="main-section">
            <div class="main-section-center">
                <h2>PROMOCJE Z CHEAPSHARK</h2>
                <p>Kliknij w dowolną kartę gry, aby zobaczyć jej szczegóły.</p>
                
                <div class="filter-container">
                    <button class="filter-btn active" data-price="all">Wszystkie ceny</button>
                    <button class="filter-btn" data-price="cheap">Tanie (poniżej 3$)</button>
                    <button class="filter-btn" data-price="sale">Duża obniżka (powyżej 80%)</button>
                </div>

                <div id="kontener-gier"></div></div>
			
			<div class="load-more-box" id="sekcja-wiecej" style="text-align: center; margin-top: 30px;">
				<button id="load-more-btn">ZAŁADUJ WIĘCEJ GIER ⏳</button>
			</div>
		</div>
		    <div class="main-section-left"></div>
		    <div class="main-section-right"></div>
		</div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-section">
                <h3>Natrzecisemestr</h3>
                <p>Strona z informacjami o grach na steamie.</p>
            </div>

            <div class="footer-section">
                <h4>Nawigacja</h4>
				<a href="index.html">HOME</a>
				<a href="premiery.html">PREMIERY</a>
				<a href="kontakt.html">KONTAKT</a>
            </div>

            <div class="footer-section">
                <h4>Autorzy</h4>
                <p>Mateusz Tomczuk</p>
                <p>Jakub Miezio</p>
                <p>Kuba Kirej</p>
            </div>
        </div>

        <div class="footer-bottom">
            &copy; 2026 Natrzecisemestr
        </div>
    </footer>

    <script>
        const menuBtn = document.querySelector('.header-menu-btn');
        const menuDropdown = document.querySelector('.header-menu');

        menuBtn.addEventListener('click', () => {
            menuDropdown.classList.toggle('active');
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
